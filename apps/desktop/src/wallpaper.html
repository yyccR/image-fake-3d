<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Wallpaper Renderer</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071b1b; }
      body { position: relative; }
      img, canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      img { object-fit: cover; }
      canvas { z-index: 1; }
      #error { position: absolute; z-index: 2; inset: 0; display: grid; place-items: center; padding: 40px; color: #f6eee0; background: #132d29; font: 14px/1.6 sans-serif; text-align: center; }
      #error[hidden] { display: none; }
    </style>
    <script type="module" src="/wallpaper.js"></script>
  </head>
  <body>
    <img id="background" alt="" hidden>
    <canvas id="wallpaperCanvas" aria-hidden="true"></canvas>
    <div id="error" hidden></div>
  </body>
</html>
